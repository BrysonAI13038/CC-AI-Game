<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moving Hoop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at 50% 10%, #273966, #090d18 65%);
    }

    #game {
      width: min(1100px, 100vw);
      height: min(680px, 100vh);
      display: block;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 25px 80px #000a;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      color: #cbd5e1;
      font-size: 12px;
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas
    id="game"
    width="1100"
    height="680"
    aria-label="Moving Hoop basketball game"
  ></canvas>

  <div class="hint">
    Aim with mouse • SPACE to shoot • R to restart
  </div>

  <script src="game.js"></script>
</body>
</html>
